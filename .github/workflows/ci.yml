name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    # El build necesita que estas variables existan (algunos clientes, como
    # el de Supabase, validan su presencia al cargar el módulo), pero nada
    # se conecta de verdad durante `next build` — son placeholders, no
    # secretos reales. Las credenciales reales solo viven en el entorno de
    # despliegue.
    env:
      ANTHROPIC_API_KEY: dummy
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
      SUPABASE_URL: https://dummy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: dummy
      AUTH_GOOGLE_ID: dummy
      AUTH_GOOGLE_SECRET: dummy
      AUTH_SECRET: dummy-secret-for-ci-build-only
      GOOGLE_SERVICE_ACCOUNT_KEY: "{}"
      GOOGLE_DRIVE_MALLAS_FOLDER_ID: dummy
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tsconfig.json incluye .next/types/**/*.ts (ahí vive el tipo
      # LayoutProps que usa layout.tsx) — en un checkout limpio ese archivo
      # todavía no existe, así que el typecheck falla si no se genera antes.
      # `next typegen` lo genera sin correr un build completo.
      - name: Generate Next.js types
        run: npx next typegen

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
